name: Validate task generators

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check application syntax
        run: |
          node --check js/app.js
          node --check js/progress.js
          node --check js/world.js
          node --check js/audio.js
          node --check js/solutions.js

      - name: Validate generated tasks
        run: npm test
